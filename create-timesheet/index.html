<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create timesheet</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { margin: 0; padding: 12px; font: 14px system-ui, sans-serif; color: #202124; background: white; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; }
    label { display: grid; gap: 4px; }
    select, button { font: inherit; min-height: 38px; padding: 7px 10px; }
    select { max-width: 100%; }
    button { border: 1px solid #096b4b; border-radius: 4px; background: #087f5b; color: white; cursor: pointer; }
    #refresh { background: white; color: #333; border-color: #aaa; }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin: 10px 0 0; }
  </style>
</head>
<body>
  <div class="controls">
    <label>Employee<select id="employee" disabled></select></label>
    <label>Pay period<select id="period" disabled></select></label>
    <button id="create" disabled>＋ Create timesheet</button>
    <button id="refresh" disabled>Refresh</button>
  </div>
  <p id="status" role="status" aria-live="polite">Waiting for Grist…</p>
  <script src="config.js"></script>
  <script src="widget.js"></script>
</body>
</html>
